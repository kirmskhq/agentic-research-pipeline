name: tests

on:
  push:
  pull_request:

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Syntax check
        run: python -m py_compile pipeline.py tests/test_pipeline.py
      - name: Offline control-flow tests (no API key, no network)
        run: python tests/test_pipeline.py
